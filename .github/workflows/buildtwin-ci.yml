# BuildTwin CI — 담당: qa (buildtwin/.claude/agents/qa.md)
# lint · unit 은 병렬로 돌아 서로의 실패를 가리지 않는다. integration · e2e 는 unit 이 초록일 때만 돈다.
# 회귀 기준(tests/metrics.json)은 unit 잡의 tests/regression 에서 강제되고, 측정값은 아티팩트로 남긴다.
# integration 잡은 통합 스위트를 **두 번** 돈다 — sqlite 갈래와 postgres 갈래(ADR 0014 §2-6).
# postgres 갈래의 바닥값은 buildtwin/tests/postgres.floor.json 이고 측정값은 postgres.measured.json 이다.
name: buildtwin-ci

on:
  push:
    paths:
      - "buildtwin/**"
      - ".github/workflows/buildtwin-ci.yml"
  pull_request:
    paths:
      - "buildtwin/**"
      - ".github/workflows/buildtwin-ci.yml"

concurrency:
  group: buildtwin-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: buildtwin

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff · mypy · eslint · tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs (open3d 런타임 — mypy 가 실제 모듈을 import 하지는 않지만 설치 실패를 막는다)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps (pyproject dependency list + dev)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check services packages tests scripts
      - name: mypy (pyproject [tool.mypy])
        run: mypy services packages
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: buildtwin/apps/web/package-lock.json
      - name: npm ci
        working-directory: buildtwin/apps/web
        run: npm ci
      - name: eslint
        working-directory: buildtwin/apps/web
        run: npm run lint
      - name: tsc --noEmit
        working-directory: buildtwin/apps/web
        run: npx tsc --noEmit

  unit:
    name: unit (pytest unit · invariants · regression / vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs for open3d
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps (pyproject dependency list + dev)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: make fixtures (합성 IFC/DXF/PLY/공정표, seed 고정)
        run: python scripts/fetch_fixtures.py
      - name: pytest unit + invariants + regression
        run: pytest tests/unit tests/invariants tests/regression -q
      - name: Upload measured metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-measured
          path: buildtwin/tests/metrics.measured.json
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: buildtwin/apps/web/package-lock.json
      - name: npm ci
        working-directory: buildtwin/apps/web
        run: npm ci
      - name: vitest
        working-directory: buildtwin/apps/web
        run: npx vitest run

  integration:
    name: integration (API + Celery eager + DB)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 30
    continue-on-error: false
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: buildtwin
          POSTGRES_PASSWORD: buildtwin
          POSTGRES_DB: buildtwin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buildtwin -d buildtwin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # DB 는 축이다(ADR 0014 §2-2): tests/integration/conftest.py 가 BUILDTWIN_CI_POSTGRES_URL 을 읽어
      # 있으면 PostgreSQL + 세션 전용 스키마로, 없으면 임시 SQLite 로 간다. 그래서 그 이름은 잡 레벨이
      # 아니라 **postgres 스텝의 env 에만** 둔다 — 여기 두면 sqlite 스텝도 보게 되어 갈래가 하나로 준다.
      BUILDTWIN_CI_REDIS_URL: redis://localhost:6379/0
      CELERY_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs for open3d
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: make fixtures
        run: python scripts/fetch_fixtures.py
      # 두 스텝은 **같은 플래그**로 돈다 — 한쪽만 자세하면 두 로그를 나란히 읽을 수 없다.
      # `-rfE` = 실패·에러의 짧은 요약(어느 테스트인지), `--tb=short` = 예외 타입과 자리.
      # 이 둘이 있어야 "컨테이너가 죽었다"(psycopg.OperationalError: connection refused)와
      # "단언이 깨졌다"(AssertionError)가 로그에서 갈린다 — 지금은 둘 다 그냥 빨간 잡이다.
      - name: pytest integration (sqlite — 로컬 make test 와 같은 갈래, seed_dev_data 는 꺼진 채로)
        run: pytest tests/integration -q -rfE --tb=short
      # 두 스텝이 같은 잡이라 앞 스텝의 실패가 뒤를 가린다(ADR 0014 §Deferred 3 이 qa 판단으로 남긴 자리).
      # !cancelled() 로 그 가림만 없앤다 — 잡을 나누면 setup(deps·fixtures)을 두 번 하게 되고,
      # 대가는 설치 스텝이 죽은 실행에서도 이 스텝이 한 번 더 죽어 로그가 시끄러워지는 것이다.
      # junit xml 은 **저장소 밖**(runner.temp)에 쓴다 — 작업 트리를 더럽히지 않으려고. 이것이 있어야
      # 다음 흔들림에서 "어느 테스트가 어떤 예외로 죽었는지"를 로그를 눈으로 훑지 않고 집어낼 수 있다
      # (계획 0009 작업 5·6 에서 미식별로 남은 1회가 이 기구가 없어서 생긴 공백이다).
      - name: pytest integration (postgres — 서비스 컨테이너 + 세션 전용 스키마)
        if: ${{ !cancelled() }}
        env:
          BUILDTWIN_CI_POSTGRES_URL: postgresql://buildtwin:buildtwin@localhost:5432/buildtwin_test
        run: pytest tests/integration -q -rfE --tb=short --junit-xml=${{ runner.temp }}/postgres-junit.xml
      # tests/postgres.measured.json 은 postgres 스텝이 덮어쓴다 — 커밋된 값과의 드리프트를 아티팩트로 남긴다.
      # 같은 값이 **잡 로그에도 한 줄**로 찍힌다(접두사 `[db-axis]`, tests/integration/conftest.py 의
      # pytest_terminal_summary) — 아티팩트를 내려받지 않아도 tests_on_postgres 의 실제 수가 보인다.
      - name: Upload measured postgres axis (+ junit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-measured
          path: |
            buildtwin/tests/postgres.measured.json
            ${{ runner.temp }}/postgres-junit.xml
          if-no-files-found: warn

  e2e:
    name: e2e (핵심 흐름 · Playwright chromium)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs for open3d
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps + playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "playwright==1.56.*" pytest-playwright
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: buildtwin/apps/web/package-lock.json
      - name: npm ci
        working-directory: buildtwin/apps/web
        run: npm ci
      - name: Build web (vite preview serves dist in the smoke test)
        working-directory: buildtwin/apps/web
        run: npm run build
      - name: make fixtures
        run: python scripts/fetch_fixtures.py
      - name: pytest e2e (core flow via TestClient + Playwright smoke via uvicorn/vite preview)
        env:
          CELERY_ALWAYS_EAGER: "true"
        run: pytest tests/e2e -q
