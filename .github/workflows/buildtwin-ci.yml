# BuildTwin CI — 담당: qa (buildtwin/.claude/agents/qa.md)
# lint · unit 은 병렬로 돌아 서로의 실패를 가리지 않는다. integration · e2e 는 unit 이 초록일 때만 돈다.
# 회귀 기준(tests/metrics.json)은 unit 잡의 tests/regression 에서 강제되고, 측정값은 아티팩트로 남긴다.
# **두 잡이 각자 자기 스위트를 두 번 돈다 — sqlite 갈래와 postgres 갈래**(ADR 0014 §2-6, ADR 0017).
# unit 잡이 postgres 갈래를 갖는 것이 계획 0013 §후속 16 이다: 그 트리가 축을 읽는데 CI 가 그 축을
# 안 돌리면 **아무도 돌리지 않는 축**이 된다(ADR 0017 §6 대안 5 가 기각한 것이 그것이다).
# 바닥값은 buildtwin/tests/postgres.floor.json 의 **트리별 키**이고(ADR 0017 결정 2), 통합 갈래의
# 측정값만 postgres.measured.json 에 남는다 — 단위 갈래의 값은 잡 로그의 [db-axis] 줄이 싣는다.
name: buildtwin-ci

on:
  push:
    paths:
      - "buildtwin/**"
      - ".github/workflows/buildtwin-ci.yml"
  pull_request:
    paths:
      - "buildtwin/**"
      - ".github/workflows/buildtwin-ci.yml"

concurrency:
  group: buildtwin-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: buildtwin

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff · mypy · eslint · tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs (open3d 런타임 — mypy 가 실제 모듈을 import 하지는 않지만 설치 실패를 막는다)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps (pyproject dependency list + dev)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check services packages tests scripts
      - name: mypy (pyproject [tool.mypy])
        run: mypy services packages
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: buildtwin/apps/web/package-lock.json
      - name: npm ci
        working-directory: buildtwin/apps/web
        run: npm ci
      - name: eslint
        working-directory: buildtwin/apps/web
        run: npm run lint
      - name: tsc --noEmit
        working-directory: buildtwin/apps/web
        run: npx tsc --noEmit

  unit:
    name: unit (pytest unit · invariants · regression / vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # 단위 트리도 축을 읽는다(ADR 0017). 컨테이너를 이 잡에 붙일지 잡을 나눌지는 소유자 판단이고,
      # 붙이는 쪽을 골랐다 — 나누면 setup(deps·fixtures·npm)을 한 번 더 하게 되고, 그 맞바꿈은 이미
      # integration 잡에서 같은 근거로 한 번 판단했다(아래 두 스텝의 주석).
      # postgis 이미지를 그대로 쓰는 것은 두 잡이 **같은 엔진**을 보게 하려는 것이다 — 이미지가 다르면
      # 두 갈래의 빨강이 엔진 차이인지 코드 차이인지 갈리지 않는다.
      # **워크플로가 스텝으로 확장을 만들지는 않지만, 테스트가 보는 DB 에는 PostGIS 가 있다.** 이 이미지의
      # 엔트리포인트가 첫 기동에 `/docker-entrypoint-initdb.d/10_postgis.sh` 를 돌려 `template_postgis` 와
      # `POSTGRES_DB`(= buildtwin_test — 아래 postgres 스텝의 `BUILDTWIN_CI_POSTGRES_URL` 이 붙는 그
      # DB) **둘 다**에 확장을 로드한다.
      # 잡 로그의 서비스 컨테이너 출력이 그것을 싣는다(`Loading PostGIS extensions into buildtwin_test`
      # 뒤에 `CREATE EXTENSION` — **확장 이름은 그 로그에 없다**). 그 로드가 로컬 엔진과 무엇을 다르게
      # 만드는지는 여전히 아무도 재지 않았다(§후속 24).
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: buildtwin
          POSTGRES_PASSWORD: buildtwin
          POSTGRES_DB: buildtwin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buildtwin -d buildtwin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs for open3d
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps (pyproject dependency list + dev)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: make fixtures (합성 IFC/DXF/PLY/공정표, seed 고정)
        run: python scripts/fetch_fixtures.py
      # 두 스텝은 **같은 세 트리 · 같은 플래그**로 돈다 — 한쪽만 다르면 두 로그를 나란히 읽을 수 없다.
      # 갈리는 것은 BUILDTWIN_CI_POSTGRES_URL 하나뿐이고, 그래서 그 이름은 잡 레벨이 아니라
      # **postgres 스텝의 env 에만** 둔다(잡 레벨에 두면 sqlite 스텝도 보게 되어 갈래가 하나로 준다).
      - name: pytest unit + invariants + regression (sqlite — 로컬 make test 와 같은 갈래)
        run: pytest tests/unit tests/invariants tests/regression -q -rfE --tb=short
      # 앞 스텝의 실패가 뒤를 가리지 않게 !cancelled() 로 연다(integration 잡과 같은 판단).
      # 이 갈래가 찍는 [db-axis] tree=tests/unit 줄이 tests_on_postgres 의 실제 수를 싣는다 —
      # 그 수가 바닥값 아래면 세션이 teardown 에서 죽는다(buildtwin/tests/postgres.floor.json).
      # 이 스텝은 postgres.measured.json 을 **쓰지 않는다**(그 파일은 통합 축의 감시다).
      - name: pytest unit + invariants + regression (postgres — 서비스 컨테이너 + 테스트별 스키마)
        if: ${{ !cancelled() }}
        env:
          BUILDTWIN_CI_POSTGRES_URL: postgresql://buildtwin:buildtwin@localhost:5432/buildtwin_test
        run: pytest tests/unit tests/invariants tests/regression -q -rfE --tb=short
      - name: Upload measured metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-measured
          path: buildtwin/tests/metrics.measured.json
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: buildtwin/apps/web/package-lock.json
      - name: npm ci
        working-directory: buildtwin/apps/web
        run: npm ci
      - name: vitest
        working-directory: buildtwin/apps/web
        run: npx vitest run

  integration:
    name: integration (API + Celery eager + DB)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 30
    continue-on-error: false
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: buildtwin
          POSTGRES_PASSWORD: buildtwin
          POSTGRES_DB: buildtwin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buildtwin -d buildtwin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # DB 는 축이다(ADR 0014 §2-2): tests/integration/conftest.py 가 BUILDTWIN_CI_POSTGRES_URL 을 읽어
      # 있으면 PostgreSQL + 세션 전용 스키마로, 없으면 임시 SQLite 로 간다. 그래서 그 이름은 잡 레벨이
      # 아니라 **postgres 스텝의 env 에만** 둔다 — 여기 두면 sqlite 스텝도 보게 되어 갈래가 하나로 준다.
      BUILDTWIN_CI_REDIS_URL: redis://localhost:6379/0
      CELERY_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs for open3d
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: make fixtures
        run: python scripts/fetch_fixtures.py
      # 두 스텝은 **같은 플래그**로 돈다 — 한쪽만 자세하면 두 로그를 나란히 읽을 수 없다.
      # `-rfE` = 실패·에러의 짧은 요약(어느 테스트인지), `--tb=short` = 예외 타입과 자리.
      # 이 둘이 있어야 "컨테이너가 죽었다"(psycopg.OperationalError: connection refused)와
      # "단언이 깨졌다"(AssertionError)가 로그에서 갈린다 — 지금은 둘 다 그냥 빨간 잡이다.
      - name: pytest integration (sqlite — 로컬 make test 와 같은 갈래, 시드는 픽스처가 명시적으로 부른다)
        run: pytest tests/integration -q -rfE --tb=short
      # 두 스텝이 같은 잡이라 앞 스텝의 실패가 뒤를 가린다(ADR 0014 §Deferred 3 이 qa 판단으로 남긴 자리).
      # !cancelled() 로 그 가림만 없앤다 — 잡을 나누면 setup(deps·fixtures)을 두 번 하게 되고,
      # 대가는 설치 스텝이 죽은 실행에서도 이 스텝이 한 번 더 죽어 로그가 시끄러워지는 것이다.
      # junit xml 은 **저장소 밖**(runner.temp)에 쓴다 — 작업 트리를 더럽히지 않으려고. 이것이 있어야
      # 다음 흔들림에서 "어느 테스트가 어떤 예외로 죽었는지"를 로그를 눈으로 훑지 않고 집어낼 수 있다
      # (계획 0009 작업 5·6 에서 미식별로 남은 1회가 이 기구가 없어서 생긴 공백이다).
      - name: pytest integration (postgres — 서비스 컨테이너 + 세션 전용 스키마)
        if: ${{ !cancelled() }}
        env:
          BUILDTWIN_CI_POSTGRES_URL: postgresql://buildtwin:buildtwin@localhost:5432/buildtwin_test
        run: pytest tests/integration -q -rfE --tb=short --junit-xml=${{ runner.temp }}/postgres-junit.xml
      # tests/postgres.measured.json 은 postgres 스텝이 덮어쓴다 — 커밋된 값과의 드리프트를 아티팩트로 남긴다.
      # 덮어쓰는 조건은 **바닥값을 만족한 실행**이고(buildtwin/tests/helpers/postgres_axis.py 의
      # should_write_measured, 바닥값은 이제 트리별 키다 — ADR 0017 결정 2), 전량이라 만족한다(187 >= 187). 부분집합·조기 종료로
      # 바닥값 미달인 실행은 이 파일을 쓰지 않는다 — 그런 실행의 값은 아래 [db-axis] 줄에만 남는다.
      # 같은 값이 **잡 로그에도 한 줄**로 찍힌다(접두사 `[db-axis]`, tests/integration/conftest.py 의
      # pytest_terminal_summary) — 아티팩트를 내려받지 않아도 tests_on_postgres 의 실제 수가 보인다.
      - name: Upload measured postgres axis (+ junit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-measured
          path: |
            buildtwin/tests/postgres.measured.json
            ${{ runner.temp }}/postgres-junit.xml
          if-no-files-found: warn

  e2e:
    name: e2e (핵심 흐름 · Playwright chromium)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: buildtwin/pyproject.toml
      - name: System libs for open3d
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libgomp1
      - name: Install python deps + playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "playwright==1.56.*" pytest-playwright
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: buildtwin/apps/web/package-lock.json
      - name: npm ci
        working-directory: buildtwin/apps/web
        run: npm ci
      - name: Build web (vite preview serves dist in the smoke test)
        working-directory: buildtwin/apps/web
        run: npm run build
      - name: make fixtures
        run: python scripts/fetch_fixtures.py
      - name: pytest e2e (core flow via TestClient + Playwright smoke via uvicorn/vite preview)
        env:
          CELERY_ALWAYS_EAGER: "true"
        run: pytest tests/e2e -q
