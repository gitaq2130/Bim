[project]
name = "buildtwin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2.0", "pydantic>=2", "pydantic-settings",
  "python-multipart", "python-jose[cryptography]", "passlib[bcrypt]", "pyyaml",
  "celery", "redis", "ortools", "numpy", "scipy", "shapely",
  "ifcopenshell", "ezdxf", "open3d", "laspy", "plyfile", "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "apps", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B904", "UP007", "UP035", "UP006", "UP045"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["apps", ".venv", "storage"]
