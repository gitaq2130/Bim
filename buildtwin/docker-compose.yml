# BuildTwin 개발 스택. make dev
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: buildtwin
      POSTGRES_PASSWORD: buildtwin
      POSTGRES_DB: buildtwin
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  api:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://buildtwin:buildtwin@db:5432/buildtwin
      REDIS_URL: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "false"
      STORAGE_ROOT: /data/storage
    volumes: [".:/app", "storage:/data/storage"]
    ports: ["8000:8000"]
    depends_on: [db, redis, minio]
  worker:
    build: { context: ., dockerfile: Dockerfile }
    command: celery -A services.common.celery_app.app worker --loglevel=info
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://buildtwin:buildtwin@db:5432/buildtwin
      REDIS_URL: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "false"
      STORAGE_ROOT: /data/storage
    volumes: [".:/app", "storage:/data/storage"]
    depends_on: [db, redis]
  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: [".:/app"]
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata: {}
  miniodata: {}
  storage: {}
