# 기계설비(mechanical) 공종 판단 규칙. 담당: knowledge. discipline은 glossary의 허용값만(mep 금지).
- id: RULE-MEC-001
  version: 1
  source: case
  source_ref: "CASE-0002"
  reliability: 0.75
  scope: { discipline: mechanical, object_types: [IfcDuctSegment, IfcDuctFitting, IfcPipeSegment, IfcPipeFitting] }
  when: "scan.state == 'MISMATCH' and scan.evidence.offset_vector.norm > 0.03"
  then:
    risk_level: HIGH
    action: "덕트·배관 설치 위치 확인, 보·타 설비와 간섭 검토 후 재시공 여부 결정"
    required_evidence: [clash_report, shop_drawing, survey_report]
  tags: [alignment, mechanical, clash]
  description: "덕트·배관 위치 이탈 30mm 초과 — 보·타 설비 간섭 위험"

- id: RULE-MEC-002
  version: 1
  source: expert
  source_ref: "설비 시공관리자 인터뷰, 2026-08"
  reliability: 0.8
  scope: { discipline: mechanical }
  when: "logic.clash_count is not None and logic.clash_count > 0 and activity.percent_complete == 0"
  then:
    risk_level: MEDIUM
    action: "착수 전 간섭(clash) 해소 확인. 시공상세도(shop drawing) 재승인 후 착수"
    required_evidence: [clash_report, shop_drawing_approval]
  tags: [clash, mechanical, readiness]
  description: "미해소 간섭이 있는 설비 작업의 착수"

- id: RULE-MEC-003
  version: 1
  source: expert
  source_ref: "CM 감리단 운영 기준(천장 내 설비 검측)"
  reliability: 0.85
  scope: { discipline: mechanical, object_types: [IfcDuctSegment, IfcPipeSegment] }
  when: "report.claimed_state == 'completed' and logic.inspection_passed is not True"
  then:
    risk_level: HIGH
    action: "천장 마감 전 설비 검측 실시. 검측 통과 전 후속 마감 착수 금지"
    required_evidence: [inspection_request, inspection_photo]
  tags: [inspection, mechanical, sequence]
  description: "천장 내 덕트·배관 완료 신고됐으나 검측 미통과"
