# 공정·자재 판단 규칙. 담당: knowledge. logic.days_until_planned_start는 엔진이 activity.planned_start로부터 파생한다.
- id: RULE-SCH-001
  version: 1
  source: expert
  source_ref: "PM 공정관리 기준(착수 7일 전 준비도 점검)"
  reliability: 0.8
  scope: {}
  when: "readiness.score < 0.5 and logic.days_until_planned_start is not None and logic.days_until_planned_start <= 7"
  then:
    risk_level: MEDIUM
    action: "착수 7일 전 준비도 미달. 차단 원인(선행·검측·자재·도면승인) 해소 계획 요구"
    required_evidence: [readiness_breakdown, action_plan]
  tags: [schedule, readiness]
  description: "계획 착수일 7일 이내인데 Readiness < 0.5"

- id: RULE-SCH-002
  version: 1
  source: expert
  source_ref: "reality-capture 운영 경험"
  reliability: 0.6
  scope: {}
  when: "scan.state == 'UNVERIFIABLE' and logic.consecutive_unverifiable is not None and logic.consecutive_unverifiable >= 2"
  then:
    risk_level: LOW
    action: "2회 연속 스캔 확인불가. 수동 검측(현장 확인·사진) 권고 또는 스캔 위치 변경"
    required_evidence: [manual_inspection_photo]
  tags: [scan, occlusion, inspection]
  description: "연속 확인불가(가림) 객체"

- id: RULE-SCH-003
  version: 1
  source: case
  source_ref: "CASE-0003"
  reliability: 0.7
  scope: { object_types: [IfcCurtainWall, IfcPlate] }
  when: "logic.material_delivered_ratio is not None and logic.material_delivered_ratio < 0.5 and logic.days_until_planned_start is not None and logic.days_until_planned_start <= 14"
  then:
    risk_level: HIGH
    action: "외장 자재 반입률 50% 미만. 납품 일정 재확인, 후속 공정(창호·실링) 일정 조정 검토"
    required_evidence: [delivery_schedule, material_receipt]
  tags: [material, schedule, facade]
  description: "착수 2주 전 외장패널 반입 부족"
