# Work Readiness Score 가중치 (합 1.0). 담당: progress-engine
weights:
  predecessor_completion: 0.30   # 선행공정 완료율 (CONFIRMED만 완료로 인정)
  inspection: 0.20               # 선행 객체 검측 통과율
  material_delivery: 0.20        # 자재 반입율
  drawing_approval: 0.15         # 도면 승인 여부
  open_clashes: 0.10             # 미결 간섭 (없으면 1.0)
  crew_assigned: 0.05            # 인력 배치
start_threshold: 0.75            # 이 값 이상이면 착수 가능
predecessor_lookback_days: 14
