# 스캔 정합·판정 임계값. 담당: reality-capture. 코드에 숫자 리터럴 금지.
registration:
  max_rmse: 0.03                 # m. 초과 시 판정 중단
  voxel_size: 0.02               # 다운샘플 복셀(m)
  icp_max_distance: 0.10         # ICP 대응점 최대 거리(m)
  icp_max_iterations: 50
  min_fitness: 0.3
verdict:
  bbox_margin: 0.05              # m. 객체 바운딩박스 여유
  surface_distance: 0.03         # m. 이 거리 안이면 표면 일치로 간주
  min_density_not_built: 20      # points/m² 미만이면 NOT_BUILT
  density_in_progress: 150       # 이 사이면 IN_PROGRESS
  density_done: 400              # 이상이고 형상 일치율 충족 시 ESTIMATED_DONE
  min_surface_match_done: 0.6    # 표면 일치율(0~1)
  mismatch_offset: 0.05          # m. 평균 offset 초과 시 MISMATCH
  occlusion_unverifiable: 0.6    # 가림 비율 초과 시 UNVERIFIABLE
  confidence_floor: 0.2
